name: 'Build'
description: 'Build package'

inputs:
  mint_version:
    description: 'The Mint version to select Debian build profiles for'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - run: |
        chown root:root .
        if [[ -n "$MINT_VERSION" && -f "debian/build-profiles.$MINT_VERSION" ]]; then
          export DEB_BUILD_PROFILES="$(cat "debian/build-profiles.$MINT_VERSION")"
        fi
        if [[ -n "${DEB_BUILD_PROFILES:-}" ]]; then
          # mint-build invokes mk-build-deps via sudo, which resets the environment.
          install -m 0440 /dev/stdin /etc/sudoers.d/mint-build-profiles <<<'Defaults env_keep += "DEB_BUILD_PROFILES"'
          trap 'rm -f /etc/sudoers.d/mint-build-profiles' EXIT
        fi
        mint-build -i
      shell: bash
      env:
        MINT_VERSION: ${{ inputs.mint_version }}
